version: 2
project_name: wireguard-linux-gui

builds:
  - id: wireguard-linux-gui
    main: .
    binary: wireguard-linux-gui
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X wireguard-linux-gui/gui.BuildDate={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - THIRD_PARTY_NOTICES.md
      - licenses/*
      - src: ./deb/usr/share/applications/wireguard-linux-gui.desktop
        dst: /usr/share/applications/wireguard-linux-gui.desktop
      - src: ./deb/usr/share/polkit-1/actions/wireguard-linux-gui.policy
        dst: /usr/share/polkit-1/actions/wireguard-linux-gui.policy
      - src: ./Icon/**/*
        dst: /usr/share/wireguard-linux-gui/Icon/

nfpms:
  - id: debian_family
    package_name: wireguard-linux-gui
    vendor: "UnnoTed"
    maintainer: "UnnoTed"
    description: "GTK4/Libadwaita GUI for WireGuard"
    license: "MIT"
    homepage: "https://github.com/UnnoTed/wireguird"
    formats: [deb]
    bindir: /usr/bin
    dependencies:
      - wireguard-tools
      - resolvconf
      - libgtk-4-1 (>= 4.14)
      - libadwaita-1-0 (>= 1.5)
    contents: &app_contents
      - src: ./THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/wireguard-linux-gui/THIRD_PARTY_NOTICES.md
      - src: ./licenses/
        dst: /usr/share/doc/wireguard-linux-gui/licenses/
        type: tree
      - src: ./deb/usr/share/applications/wireguard-linux-gui.desktop
        dst: /usr/share/applications/wireguard-linux-gui.desktop
      - src: ./deb/usr/share/polkit-1/actions/wireguard-linux-gui.policy
        dst: /usr/share/polkit-1/actions/wireguard-linux-gui.policy
        file_info:
          mode: 0644
      - src: ./Icon/
        dst: /usr/share/wireguard-linux-gui/Icon/
        type: tree

  - id: fedora_family
    package_name: wireguard-linux-gui
    vendor: "UnnoTed"
    maintainer: "UnnoTed"
    description: "GTK4/Libadwaita GUI for WireGuard"
    license: "MIT"
    homepage: "https://github.com/UnnoTed/wireguird"
    formats: [rpm]
    bindir: /usr/bin
    dependencies:
      - wireguard-tools
      - gtk4 >= 4.14
      - libadwaita >= 1.5
    contents: *app_contents

release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"
